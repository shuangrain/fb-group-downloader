[project]
name = "fb-group-downloader"
version = "0.1.0"
description = "Facebook 社團圖片、影片與檔案定期下載與備份工具"
readme = "README.md"
authors = [
    { name = "lex.xu", email = "shuangrain07@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
fb-downloader = "fb_group_downloader.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (standard pattern in Typer/FastAPI)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
